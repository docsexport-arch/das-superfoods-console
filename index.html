<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Das Superfoods — Export console</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400..700&family=Inter:wght@400..700&family=Space+Grotesk:wght@400..600&display=swap">
  <script>
    // Apply the saved theme before first paint so the page never flashes.
    try { if (localStorage.getItem("das-superfoods-erp/theme") === "light") document.documentElement.dataset.theme = "light"; } catch (e) {}
  </script>
</head>
<body>
  <div id="root"></div>
  <noscript>The export console needs JavaScript to run.</noscript>
  <script type="module" src="/src/main.jsx"></script>
</body>
</html>
