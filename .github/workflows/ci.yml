name: ci

# Tests → build → bundle check, on every push and pull request.
# Each gate is its own step so a green tick says WHICH gate passed.
on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install
        run: npm ci --no-fund --no-audit
      - name: Tests and gates
        run: npm test
      - name: Build
        run: npm run build
      - name: Bundle check
        run: npm run check:bundle
